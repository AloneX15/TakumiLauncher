[workspace]
members = [
    "apps/launcher/src-tauri",
    "apps/api",
    "packages/minecraft-resolver",
    "packages/download-manager",
    "packages/auth-system",
    "packages/manifest-system",
    "packages/update-engine",
    "packages/instance-manager",
    "packages/types",
    "packages/telemetry",
]

resolver = "2"

[workspace.package]
version = "0.1.0"
edition = "2021"
authors = ["TakumiLabs <dev@takumilabs.com>"]
license = "MIT"
repository = "https://github.com"

[workspace.dependencies]
# Third-Party Dependencies
tokio = { version = "1.35", features = ["full"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
tracing = "0.1"
tracing-subscriber = "0.3"
thiserror = "1.0"
anyhow = "1.0"
uuid = { version = "1.6", features = ["v4", "serde"] }
chrono = { version = "0.4", features = ["serde"] }
reqwest = { version = "0.11", features = ["json"] }
sha2 = "0.10"
hex = "0.4"
sha1 = "0.10"
zip = { version = "0.6", default-features = false, features = ["deflate"] }
keyring = "2"
futures = "0.3"
axum = "0.7"
tower = "0.4"
tower-http = { version = "0.5", features = ["trace", "cors"] }
hyper = "1.1"
jsonwebtoken = "9.2"
argon2 = "0.5"
rand = "0.8"

# Local Workspace Packages (Fixed Paths)
auth-system = { path = "packages/auth-system" }
minecraft-resolver = { path = "packages/minecraft-resolver" }
download-manager = { path = "packages/download-manager" }
manifest-system = { path = "packages/manifest-system" }
update-engine = { path = "packages/update-engine" }
instance-manager = { path = "packages/instance-manager" }
types = { path = "packages/types" }
telemetry = { path = "packages/telemetry" }

[profile.dev]
opt-level = 0

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
strip = true
